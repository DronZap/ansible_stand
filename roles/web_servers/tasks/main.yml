- name: install apache2 and php package
  tags: apache,apache2,ubuntu
  package:
    name:
      - apache2
      - libapache2-mod-php
    state: latest
    update_cache: yes

- name: staert apache2
  tags: apache,apache2,ubuntu
  service:
    name: apache2
    state: started
    enabled: yes

- name: copy default html file for site
  tags: apache,apache2,httpd
  copy:
    src: default_site.html
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: 0644
